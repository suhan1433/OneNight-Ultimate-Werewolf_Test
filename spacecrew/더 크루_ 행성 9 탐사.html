<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>더 크루: 행성 9 탐사</title>
<style>
:root{--bg:#0b1428;--pn:#13213f;--ink:#f1e9d2;--mut:#8fa3c4;--gold:#d4a84b;--teal:#3fd0c0;--bad:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 30% 0,#17294f,var(--bg) 60%) fixed;color:var(--ink);font:16px/1.5 "Pretendard","Noto Sans KR",system-ui,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;background-image:radial-gradient(1px 1px at 20px 30px,#fff8,transparent),radial-gradient(1px 1px at 120px 90px,#fff6,transparent),radial-gradient(1.5px 1.5px at 200px 160px,#fff9,transparent);background-size:240px 200px;animation:dr 120s linear infinite;pointer-events:none}
@keyframes dr{to{background-position:-240px 200px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#app{position:relative;max-width:880px;margin:0 auto;padding:16px}
h1{font-size:2.4rem;margin:.6em 0 .1em;letter-spacing:.05em}h1 small{display:block;font-size:1rem;color:var(--teal);font-family:ui-monospace,monospace;letter-spacing:.3em}
h2{margin:.2em 0;font-size:1.15rem;color:var(--gold)}
.pn{background:var(--pn);border:1px solid #2a3f6b;border-radius:12px;padding:12px 14px;margin:10px 0}
.m{color:var(--mut)}.mono{font-family:ui-monospace,monospace}
.btn{background:var(--gold);color:#1a1405;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--mut)}.btn:disabled{opacity:.35;cursor:not-allowed}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.mb{background:var(--pn);border:1px solid #2a3f6b;color:var(--ink);border-radius:10px;padding:10px 0;font:inherit;cursor:pointer;position:relative}
.mb.gold{border-style:dashed}.mb.done{border-color:var(--gold);color:var(--gold)}.mb.done:after{content:"✓";position:absolute;top:1px;right:6px;font-size:.8rem}.mb:disabled{opacity:.3;cursor:not-allowed}
.hand,.row{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.card{width:58px;height:84px;border-radius:8px;border:2px solid var(--c);background:#0d1830;color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;cursor:pointer;transition:transform .2s}
.card b{font-size:1.6rem;line-height:1}.card i{font-style:normal;font-size:1.2rem}
.card:not(:disabled):hover{transform:translateY(-6px)}.card:disabled{opacity:.3;cursor:not-allowed}
.card.s{width:40px;height:50px}.card.s b{font-size:1.1rem}.card.s i{font-size:.9rem}
.card.win{box-shadow:0 0 14px var(--gold);background:#2a2410}
.tk{display:inline-block;background:var(--gold);color:#1a1405;border-radius:11px;min-width:22px;padding:0 6px;text-align:center;font-weight:700;font-size:.8rem;line-height:22px}
.tr{display:flex;gap:10px;align-items:center;margin:4px 0;flex-wrap:wrap}.dn{opacity:.5}
.cover{text-align:center;padding:50px 10px}.bad{color:var(--bad)}.ok{color:var(--teal)}
</style></head><body><div id="app"></div>
<script>
const S={P:['분홍','●','#ff7eb6'],B:['파랑','▲','#6aa8ff'],G:['초록','■','#5fd68a'],Y:['노랑','★','#ffd35c'],R:['로켓','🚀','#e8e8f4']};
/* 로그북 기준 미션표: t=과제수 o=번호토큰수 om=Ω ar=화살표수 dz=데드존 dis=통신 가능 트릭 pk=지정(1 누구나,2 커맨더 제외) dist=커맨더 분배 */
const MS={1:{t:1},2:{t:2},3:{t:2,o:2},4:{t:3},5:{t:3,sp:'sick',pk:1},6:{t:3,ar:2,dz:1},7:{t:3,om:1},8:{t:3,o:3},9:{t:0,sp:'w1'},10:{t:4},
11:{t:4,o:1,sp:'nc',pk:2},12:{t:4,om:1,sp:'swap'},13:{t:0,sp:'r4'},14:{t:4,ar:3,dz:1},15:{t:4,o:4},16:{t:0,sp:'n9'},17:{t:2,sp:'n9'},18:{t:5,dis:2},19:{t:5,o:1,dis:3},
20:{t:2,sp:'all',pk:2},21:{t:5,o:2,dz:1},22:{t:5,ar:4},24:{t:6,dist:1},25:{t:6,ar:2,dz:1},26:{t:0,sp:'w1x2'},27:{t:3,sp:'all',pk:2},28:{t:6,o:1,om:1,dis:3},29:{t:0,sp:'bal',dz:1},30:{t:6,ar:3,dis:2},
31:{t:6,o:3},32:{t:7,dist:1},33:{t:0,sp:'one',pk:1},34:{t:0,sp:'bal',cf:1},35:{t:7,ar:3},36:{t:7,o:2,dist:1},37:{t:4,sp:'all',pk:2},38:{t:8,dis:3},39:{t:8,ar:3,dz:1},
41:{t:0,sp:'fl',pk:1},42:{t:9},43:{t:9,dist:1},44:{t:0,sp:'r1234'},45:{t:9,ar:3},46:{t:0,sp:'pink'},47:{t:10},48:{t:3,om:1,sp:'oml'},49:{t:10,ar:3},50:{t:0,sp:'fin',pk:1}};
const SPL={w1:'값이 1인 카드로 이기는 트릭이 최소 1번 있어야 합니다',w1x2:'값이 1인 카드가 서로 다른 두 트릭을 이겨야 합니다',r4:'로켓 1·2·3·4가 각각 최소 한 번 트릭을 이겨야 합니다',n9:'값이 9인 카드로 트릭을 이기면 실패합니다',sick:'커맨더가 지정한 아픈 승무원은 트릭을 하나도 이기면 안 됩니다',nc:'지정된 승무원은 이 미션에서 통신할 수 없습니다',swap:'첫 트릭 직후 모두 오른쪽 이웃의 손패에서 무작위 1장을 가져옵니다',all:'지정된 승무원 한 명이 모든 과제를 맡습니다',bal:'어느 시점에도 승리 트릭 수 차이가 2 이상이면 실패합니다',one:'지정된 승무원이 로켓이 아닌 카드로 정확히 1트릭만 이겨야 합니다',fl:'지정된 승무원이 첫·마지막 트릭만 이겨야 하며 로켓 승리는 금지입니다',r1234:'로켓 1→2→3→4 순서로 각각 트릭을 이겨야 합니다',pink:'분홍 9 소유자의 왼쪽 승무원이 모든 분홍 카드를 가져와야 합니다',oml:'Ω 과제는 마지막 트릭에서 완료해야 합니다',fin:'지정된 한 명이 1~4번째, 다른 한 명이 마지막, 나머지가 중간 트릭을 모두 이깁니다'};
const KS={hi:'최고',one:'유일',lo:'최저'};
function desc(m){const a=[m.t?`과제 ${m.t}장`:'과제 카드 없음'];if(m.o)a.push('순서 토큰 '+Array.from({length:m.o},(_,i)=>i+1).join('→'));if(m.om)a.push('Ω 토큰(마지막 완료)');if(m.ar)a.push('화살표 토큰 '+Array.from({length:m.ar},(_,i)=>'>'.repeat(i+1)).join(' → '));if(m.dz)a.push('데드 존: 통신 카드의 최고/유일/최저 표시 숨김');if(m.dis)a.push(`${m.dis}번째 트릭 직전부터 통신 가능`);if(m.dist)a.push('커맨더가 과제 분배(인원 차이 1 이하)');if(m.cf)a.push('커맨더가 첫·마지막 트릭을 이겨야 함');if(m.sp)a.push(SPL[m.sp]);return a.join(' · ')}
const $=document.getElementById('app'),R=h=>{$.innerHTML=h};
let prog={done:[],att:{}};try{prog=JSON.parse(localStorage.getItem('crew9'))||prog}catch(e){}
const save=()=>{try{localStorage.setItem('crew9',JSON.stringify(prog))}catch(e){}};
let g=null,np=3,att=1,mid=1,dsOn=false;
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const nm=i=>'승무원 '+'ABCDE'[i],lab=c=>S[c.s][1]+c.v;
const card=(c,cls='',at='')=>`<button class="card ${cls}" style="--c:${S[c.s][2]}" ${at} aria-label="${S[c.s][0]} ${c.v}"><b>${c.v}</b><i>${S[c.s][1]}</i></button>`;
const tok=t=>(t.ord!=null?`<span class="tk">${t.ord}</span>`:'')+(t.arw?`<span class="tk">${'>'.repeat(t.arw)}</span>`:'');

function title(){g=null;R(`<div style="text-align:center"><h1>더 크루<small>PLANET NINE · 항해일지</small></h1><p class="m">태양계 외곽의 희미한 신호를 함께 해석하는 협력 트릭테이킹.<br>한 기기를 돌려쓰는 로컬 플레이 (3~5명)</p>
<p>인원 <select onchange="np=+this.value">${[3,4,5].map(n=>`<option ${n==np?'selected':''}>${n}</option>`).join('')}</select></p><button class="btn" onclick="map()">캠페인 지도</button><button class="btn g" onclick="rules()">규칙 설명</button></div>`)}
function rules(){R(`<h2>규칙 요약</h2><div class="pn"><p>• 로켓 4 보유자가 <b>커맨더</b>: 과제 선택을 시작하고 첫 트릭을 엽니다. 이후엔 직전 트릭 승자가 엽니다.</p><p>• 선도 무늬를 따라야 하고(없으면 자유), 로켓은 트럼프입니다. 이기도록 강제되지 않습니다.</p>
<p>• 과제 카드와 같은 카드가 나온 트릭을 담당자가 이기면 완료, 다른 사람이 이기면 즉시 실패.</p><p>• <b>통신</b>: 트릭 시작 전 승무원마다 1회, 색 카드 중 무늬별 최고·유일·최저 카드만 공개(로켓 불가). 토큰 위치는 이후 바뀌지 않습니다.</p>
<p>• <b>구조 신호</b>: 과제 배정 후 통신 전에 전원 합의로 사용. 같은 방향으로 로켓 아닌 카드 1장씩 전달. 사용하면 성공 기록 +1회, 미션 성공 때까지 유지됩니다.</p><p>• 번호 토큰이 있으면 번호 → 토큰 없는 과제 순으로 완료. 연속 토큰은 같은 트릭에서 동시 완료 가능. 카드 내용을 말로 알리지 마세요.</p></div><button class="btn" onclick="title()">돌아가기</button>`)}
function map(){R(`<h2>캠페인 지도</h2><p class="m mono">${prog.done.length}개 완료 · 점선 테두리 = 5인 플레이 추가 규칙 구간(미구현)</p><div class="map">${Array.from({length:50},(_,i)=>i+1).map(n=>`<button class="mb ${prog.done.includes(n)?'done':''} ${n>=25?'gold':''}" ${MS[n]?`onclick="brief(${n})"`:'disabled'}>${n}</button>`).join('')}</div><p><button class="btn g" onclick="title()">처음으로</button></p>`)}
function brief(n){if(n!=mid)dsOn=false;mid=n;att=1;R(`<h2>미션 ${n} 브리핑</h2><div class="pn"><p>${desc(MS[n])}</p><p class="m">${np}명${prog.att[n]?' · 최고 기록 '+prog.att[n]+'회':''}</p></div><button class="btn" onclick="start()">미션 시작</button><button class="btn g" onclick="map()">지도</button>`)}

function start(){
 const m=MS[mid],deck=sh([...'PBGY'].flatMap(s=>[1,2,3,4,5,6,7,8,9].map(v=>({s,v}))).concat([1,2,3,4].map(v=>({s:'R',v}))));
 const hands=Array.from({length:np},()=>[]);deck.forEach((c,i)=>hands[i%np].push(c));hands.forEach(h=>h.sort((a,b)=>a.s.localeCompare(b.s)||a.v-b.v));
 const cmd=hands.findIndex(h=>h.some(c=>c.s=='R'&&c.v==4)),o=m.o||0;
 const pool=sh([...'PBGY'].flatMap(s=>[1,2,3,4,5,6,7,8,9].map(v=>({s,v})))).slice(0,m.t).map((c,i)=>({...c,owner:null,done:false,ord:i<o?i+1:(m.om&&i==o?'Ω':null),arw:i<(m.ar||0)?i+1:null}));
 const q=[];if(m.pk)q.push('sel');if(m.sp=='fin')q.push('sel');if(m.t)q.push(m.sp=='all'?'all':m.dist?'dist':'assign');q.push('ds','play');
 g={hands,cmd,tasks:pool,trick:[],wins:Array(np).fill(0),tn:0,total:40/np|0,cur:cmd,lead:cmd,cover:true,c1:0,rk:new Set(),comm:Array(np).fill(null),tgt:null,A:null,B:null,tw:0,f1:0,fl:0,rn:0,pw:0,msg:[],out:null,q,ph:'',di:0};
 if(m.sp=='pink'){g.own=hands.findIndex(h=>h.some(c=>c.s=='P'&&c.v==9));g.tgt=(g.own+1)%np}
 adv()}
function adv(){g.ph=g.q.shift();g.cover=true;g.cur=g.cmd;g.di=0;if(g.ph=='all'){g.tasks.forEach(t=>t.owner=g.tgt);return adv()}draw()}
function hdr(){return `<div class="row" style="justify-content:space-between"><h2>미션 ${mid} · ${att}번째 시도${dsOn?' 🛰':''}</h2><span class="m mono">트릭 ${Math.min(g.tn+1,g.total)}/${g.total}</span></div>`}
function info(){const m=MS[mid];let x='';if(m.sp=='fin')x=` · 1~4트릭: ${nm(g.A)} · 마지막: ${nm(g.B)}`;else if(m.sp=='pink')x=` · 분홍 9: ${nm(g.own)} → 목표 ${nm(g.tgt)}`;else if(g.tgt!=null)x=` · 지정: ${nm(g.tgt)}`;return `<div class="pn m" style="font-size:.85rem">${desc(m)}${x}</div>`}
function taskPanel(){return g.tasks.length?`<div class="pn"><h2>과제</h2>${g.tasks.map(t=>`<div class="tr ${t.done?'dn':''}">${card(t,'s','disabled')}${tok(t)}<span>${t.owner==null?'<span class="m">미배정</span>':nm(t.owner)}</span>${t.done?'<span class="ok">✓ 완료</span>':''}</div>`).join('')}</div>`:''}
function stat(){const m=MS[mid],cs=g.comm.map((c,i)=>c?`${nm(i).slice(4)}: ${lab(c.c)} ${m.dz?'?':KS[c.k]}${c.used?' (사용됨)':''}`:'').filter(Boolean);
 return `<div class="pn mono" style="font-size:.85rem">${g.wins.map((w,i)=>`${nm(i)}${i==g.cmd?'👑':''}: ${w}승`).join(' · ')}${cs.length?'<br>📡 통신 — '+cs.join(' · '):''}</div>`}
const cover=(i,msg,ex='')=>`<div class="cover"><p class="m">${msg}</p><h2 style="font-size:1.6rem">${nm(i)}${i==g.cmd?' 👑 커맨더':''}에게 기기를 넘기세요</h2><button class="btn" onclick="g.cover=false;draw()">준비 완료</button>${ex}</div>`;
const handHTML=(i,fn,ok)=>`<div class="pn"><h2>${nm(i)}의 손패</h2><div class="hand">${g.hands[i].map((c,k)=>card(c,'',ok(c)?`onclick="${fn}(${k})"`:'disabled')).join('')}</div></div>`;
const peers=(fn,ex)=>`<div class="row">${Array.from({length:np},(_,p)=>p).filter(p=>!ex(p)).map(p=>`<button class="btn" onclick="${fn}(${p})">${nm(p)}${p==g.cmd?' 👑':''}</button>`).join('')}</div>`;

function elig(p){const h=g.hands[p],r=[];for(const s of 'PBGY'){const a=h.filter(c=>c.s==s).sort((x,y)=>x.v-y.v);a.forEach((c,i)=>{const k=a.length==1?'one':i==a.length-1?'hi':i==0?'lo':null;if(k)r.push({c,k})})}return r}
function canC(p){const m=MS[mid];return g.tn+1>=(m.dis||1)&&!(m.sp=='nc'&&g.tgt==p)&&!g.comm[p]&&elig(p).length>0}

function draw(){const ph=g.ph,m=MS[mid];
 if(ph=='sel'){if(g.cover)return R(hdr()+info()+cover(g.cmd,'지정 — 커맨더가 선택합니다'));
  const t=m.sp=='fin'?(g.A==null?'1~4번째 트릭을 맡을 승무원':'마지막 트릭을 맡을 승무원'):'대상 승무원을 지정하세요';
  return R(hdr()+`<div class="pn"><h2>${t}</h2><p class="m">손패 정보는 말하지 마세요.</p>${peers('selp',p=>(m.pk==2&&p==g.cmd)||p==g.A)}</div>`+handHTML(g.cmd,'',()=>0))}
 if(ph=='assign'){if(g.cover)return R(hdr()+taskPanel()+cover(g.cur,'과제 배정 — 선택하는 사람만 화면을 보세요'));
  const un=g.tasks.map((t,k)=>[t,k]).filter(x=>x[0].owner==null);
  return R(hdr()+`<div class="pn"><h2>${nm(g.cur)}님, 맡을 과제를 고르세요</h2><div class="row">${un.map(([t,k])=>`<div style="text-align:center">${card(t,'',`onclick="pick(${k})"`)}<br>${tok(t)}</div>`).join('')}</div></div>`+handHTML(g.cur,'',()=>0)+taskPanel())}
 if(ph=='dist'){if(g.cover)return R(hdr()+taskPanel()+cover(g.cmd,'커맨더 분배 — 과제를 한 장씩 담당자에게 맡깁니다'));
  const t=g.tasks[g.di],lim=Math.ceil(m.t/np);
  return R(hdr()+`<div class="pn"><h2>이 과제를 누구에게?</h2><div class="row">${card(t,'','disabled')}${tok(t)}</div><div class="row" style="margin-top:8px">${Array.from({length:np},(_,p)=>`<button class="btn" ${g.tasks.filter(x=>x.owner==p).length>=lim?'disabled':''} onclick="distP(${p})">${nm(p)}</button>`).join('')}</div><p class="m">담당 수 차이가 1을 넘지 않도록 최대 ${lim}장까지.</p></div>`+handHTML(g.cmd,'',()=>0)+taskPanel())}
 if(ph=='ds'){const ok=g.hands.every(h=>h.some(c=>c.s!='R'));
  return R(hdr()+taskPanel()+`<div class="pn"><h2>구조 신호${dsOn?' (활성 유지 중)':''}</h2><p class="m">전원이 동의할 때만 사용. 모두 같은 방향으로 로켓이 아닌 카드 1장을 전달합니다. 사용하면 성공 기록 +1회. 방향: 왼쪽=다음 좌석(A→B).</p><button class="btn" onclick="dsGo(0)">사용 안 함</button>${ok?`<button class="btn g" onclick="dsGo(1)">왼쪽으로</button><button class="btn g" onclick="dsGo(-1)">오른쪽으로</button>`:'<p class="bad">로켓만 가진 승무원이 있어 사용할 수 없습니다.</p>'}</div>`)}
 if(ph=='dsp'){if(g.cover)return R(hdr()+cover(g.cur,'전달할 카드 선택'));return R(hdr()+`<p>넘길 카드(로켓 제외)를 고르세요.</p>`+handHTML(g.cur,'dsPick',c=>c.s!='R'))}
 if(ph=='cm')return R(hdr()+stat()+`<div class="pn"><h2>통신할 승무원</h2>${peers('cmWho',p=>!canC(p))||''}<button class="btn g" onclick="g.ph='play';g.cover=true;draw()">돌아가기</button></div>`);
 if(ph=='cmc'){if(g.cover)return R(hdr()+cover(g.cp,'통신 — 본인만 확인'));
  return R(hdr()+`<div class="pn"><h2>${nm(g.cp)}: 공개할 카드</h2><p class="m">${m.dz?'데드 존: 최고/유일/최저 표시는 상대에게 전달되지 않습니다.':'무늬별 최고·유일·최저 카드만 가능합니다.'}</p><div class="row">${elig(g.cp).map((e,i)=>`<div style="text-align:center">${card(e.c,'',`onclick="cmPick(${i})"`)}<div class="m" style="font-size:.75rem">${KS[e.k]}</div></div>`).join('')}</div></div>`)}
 if(ph=='play'){const ex=g.trick.length==0&&g.hands.some((_,p)=>canC(p))?`<p><button class="btn g" onclick="g.ph='cm';draw()">📡 통신</button></p>`:'';
  return R(hdr()+info()+stat()+taskPanel()+trickBox(null)+(g.cover?cover(g.cur,g.tn?'다음 트릭':'첫 트릭 — 커맨더가 시작합니다',ex):handHTML(g.cur,'play',legal)))}
 if(ph=='res')return R(hdr()+stat()+taskPanel()+trickBox(g.lead)+`<div class="pn">${g.msg.map(x=>`<p>${x}</p>`).join('')}</div><button class="btn" onclick="after()">${g.out?'결과 보기':'다음 트릭'}</button>`);
 if(ph=='end')endScreen()}
function trickBox(w){return `<div class="pn"><h2>현재 트릭${g.trick.length?' · 선도 '+S[g.trick[0].c.s][0]:''}</h2><div class="row" style="min-height:90px">${g.trick.map(x=>`<div style="text-align:center">${card(x.c,x.p===w?'win':'','disabled')}<div class="m" style="font-size:.75rem">${nm(x.p).slice(4)}</div></div>`).join('')||'<span class="m">아직 낸 카드가 없습니다</span>'}</div></div>`}

function selp(p){if(MS[mid].sp=='fin'){if(g.A==null)g.A=p;else g.B=p}else g.tgt=p;adv()}
function pick(k){g.tasks[k].owner=g.cur;g.cur=(g.cur+1)%np;g.cover=true;if(g.tasks.every(t=>t.owner!=null))return adv();draw()}
function distP(p){g.tasks[g.di++].owner=p;if(g.di>=g.tasks.length)return adv();draw()}
function dsGo(d){if(!d)return adv();dsOn=true;g.dsd=d;g.sel2=[];g.ph='dsp';g.cur=0;g.cover=true;draw()}
function dsPick(k){g.sel2.push({p:g.cur,c:g.hands[g.cur][k]});g.cur++;g.cover=true;
 if(g.cur<np)return draw();
 g.sel2.forEach(x=>g.hands[x.p].splice(g.hands[x.p].indexOf(x.c),1));g.sel2.forEach(x=>g.hands[(x.p+g.dsd+np)%np].push(x.c));
 g.hands.forEach(h=>h.sort((a,b)=>a.s.localeCompare(b.s)||a.v-b.v));g.cur=g.cmd;adv()}
function cmWho(p){g.cp=p;g.ph='cmc';g.cover=true;draw()}
function cmPick(i){const e=elig(g.cp)[i];g.comm[g.cp]={c:e.c,k:e.k,used:false};g.ph='play';g.cover=true;draw()}
function legal(c){const h=g.hands[g.cur];if(!g.trick.length)return true;const ls=g.trick[0].c.s;return h.some(x=>x.s==ls)?c.s==ls:true}
function play(k){const c=g.hands[g.cur][k];if(!legal(c))return;g.hands[g.cur].splice(k,1);g.trick.push({p:g.cur,c});
 if(g.trick.length<np){g.cur=(g.cur+1)%np;g.cover=true;return draw()}resolve()}

function resolve(){
 const t=g.trick,rk=t.filter(x=>x.c.s=='R'),pool=rk.length?rk:t.filter(x=>x.c.s==t[0].c.s),w=pool.reduce((a,b)=>b.c.v>a.c.v?b:a),win=w.p,m=MS[mid],c=w.c,isR=c.s=='R';
 const msg=[`<b>${nm(win)}</b>이(가) ${lab(c)}로 트릭을 가져갑니다.`];let fail=null;const f=s=>{fail=fail||s};
 g.wins[win]++;const idx=++g.tn;g.lead=win;g.last=t.slice();
 t.forEach(x=>{const cm=g.comm[x.p];if(cm&&cm.c===x.c)cm.used=true});
 if(c.v==1)g.c1++;if(isR)g.rk.add(c.v);
 const before=g.tasks.map(x=>x.done),D=[];
 g.tasks.forEach((x,i)=>{if(x.done)return;if(t.some(y=>y.c.s==x.s&&y.c.v==x.v)){if(x.owner==win)D.push(i);else f(`${nm(x.owner)}의 과제 ${lab(x)}이(가) ${nm(win)}에게 넘어갔습니다.`)}});
 D.forEach(i=>msg.push(`<span class="ok">✓ 과제 ${lab(g.tasks[i])} 완료</span>`));
 const num=y=>typeof y.ord=='number',pend=j=>!before[j]&&!D.includes(j);
 D.forEach(i=>{const x=g.tasks[i];
  if(num(x)&&g.tasks.some((y,j)=>num(y)&&y.ord<x.ord&&pend(j)))f(`번호 토큰 ${x.ord}번 과제를 앞선 번호보다 먼저 완료했습니다.`);
  if(x.ord==null&&m.o&&g.tasks.some((y,j)=>num(y)&&pend(j)))f('토큰 없는 과제를 번호 토큰 과제보다 먼저 완료했습니다.');
  if(x.arw&&g.tasks.some((y,j)=>y.arw&&y.arw<x.arw&&pend(j)))f('화살표 토큰의 선후 순서를 어겼습니다.');
  if(x.ord=='Ω'){if(g.tasks.some((y,j)=>j!=i&&!before[j]))f('Ω 과제는 다른 모든 과제보다 나중에 완료해야 합니다.');if(m.sp=='oml'&&idx<g.total)f('Ω 과제는 마지막 트릭에서 완료해야 합니다.')}});
 D.forEach(i=>g.tasks[i].done=true);
 const sp=m.sp,tg=g.tgt;
 if(sp=='n9'&&c.v==9)f(`값이 9인 카드(${lab(c)})로 트릭을 이겼습니다.`);
 if(sp=='sick'&&win==tg)f(`아픈 ${nm(tg)}이(가) 트릭을 이겼습니다.`);
 if(sp=='one'&&win==tg){if(isR)f('지정된 승무원이 로켓으로 이겼습니다.');if(++g.tw>1)f('지정된 승무원이 두 번째 트릭을 이겼습니다.')}
 if(sp=='fl'){const edge=idx==1||idx==g.total;if(win==tg){if(isR)f('첫·마지막 트릭을 로켓으로 이길 수 없습니다.');else if(!edge)f('지정된 승무원이 중간 트릭을 이겼습니다.');else idx==1?g.f1=1:g.fl=1}else if(edge)f('첫·마지막 트릭은 지정된 승무원이 이겨야 합니다.')}
 if(sp=='bal'){if(Math.max(...g.wins)-Math.min(...g.wins)>=2)f('승리 트릭 수 차이가 2 이상이 되었습니다.');if(m.cf&&(idx==1||idx==g.total)&&win!=g.cmd)f('커맨더가 첫·마지막 트릭을 이겨야 합니다.')}
 if(sp=='r1234'&&isR){if(c.v!=g.rn+1)f(`로켓 ${g.rn+1}이(가) 먼저 이겨야 하는데 로켓 ${c.v}이(가) 이겼습니다.`);else g.rn++}
 if(sp=='pink'){const pc=t.filter(x=>x.c.s=='P').length;if(pc){if(win!=tg)f(`분홍 카드가 ${nm(win)}에게 넘어갔습니다. (목표 ${nm(tg)})`);else g.pw+=pc}}
 if(sp=='fin'){const ok=idx<=4?win==g.A:idx==g.total?win==g.B:(win!=g.A&&win!=g.B);if(!ok)f(`${idx}번째 트릭은 ${idx<=4?nm(g.A):idx==g.total?nm(g.B):'나머지 승무원'}이(가) 이겨야 합니다.`)}
 const all=g.tasks.every(x=>x.done);
 const spOK={w1:g.c1>=1,w1x2:g.c1>=2,r4:g.rk.size==4,r1234:g.rn==4,pink:g.pw==9,one:g.tw==1,fl:g.f1&&g.fl}[sp]??true;
 const endOnly=['n9','sick','one','fl','bal','fin'].includes(sp);
 if(fail){g.out='fail';g.why=fail}
 else if(all&&spOK&&!endOnly)g.out='win';
 else if(g.tn>=g.total){if(all&&spOK)g.out='win';else{g.out='fail';g.why=!all?'남은 트릭이 없는데 완료하지 못한 과제가 있습니다.':'추가 목표를 달성하지 못했습니다.'}}
 g.msg=msg;if(g.out=='fail')msg.push(`<span class="bad">✗ ${g.why}</span>`);if(g.out=='win')msg.push('<span class="ok">모든 목표 달성!</span>');
 g.ph='res';draw()}
function after(){if(g.out){g.ph='end';return draw()}
 if(MS[mid].sp=='swap'&&g.tn==1){const take=g.hands.map((_,p)=>{const s=g.hands[(p-1+np)%np];return s.splice(Math.random()*s.length|0,1)[0]});
  /* 동시 처리를 위해 원본에서 뽑은 뒤 일괄 반영 */
  take.forEach((c,p)=>g.hands[p].push(c));g.hands.forEach(h=>h.sort((a,b)=>a.s.localeCompare(b.s)||a.v-b.v))}
 g.trick=[];g.cur=g.lead;g.cover=true;g.ph='play';draw()}
function endScreen(){
 if(g.out=='win'){const sc=att+(dsOn?1:0);if(!prog.done.includes(mid))prog.done.push(mid);prog.att[mid]=Math.min(prog.att[mid]||99,sc);save();
  if(mid==50)return R(`<div style="text-align:center"><h1 class="ok" style="font-size:2rem">에필로그</h1><div class="pn" style="text-align:left"><p>무사히 지구에 착륙했습니다. 웜홀 도약 소식은 전 세계로 퍼졌고, 가족과의 재회는 긴 항해의 피로를 잊게 합니다.</p><p>당신들이 가져온 자료는 행성 9가 정착에 적합한 표면을 가졌음을 보여 주었고, 웜홀을 통해 그곳에 닿는 길이 열렸습니다. 외곽 태양계에서 시작될 우주 탐사의 새 시대 — 행성 9 발견은 그 첫 장이었습니다.</p></div><p>기록 ${sc}회 시도</p><button class="btn" onclick="map()">캠페인 지도</button></div>`);
  let nx=0;for(let n=mid+1;n<=50;n++)if(MS[n]){nx=n;break}
  R(`<div style="text-align:center"><h1 class="ok" style="font-size:2rem">미션 ${mid} 성공</h1><p>시도 ${att}회${dsOn?' + 구조 신호 1회':''} → 기록 <b>${sc}</b></p><p class="m">관측 기록에 금색 도장이 찍혔습니다.</p>${nx?`<button class="btn" onclick="brief(${nx})">다음 미션</button>`:''}<button class="btn g" onclick="map()">캠페인 지도</button></div>`);return}
 R(`<div style="text-align:center"><h1 class="bad" style="font-size:2rem">미션 ${mid} 실패</h1><div class="pn"><p>${g.why}</p></div>${trickBox(null)}<button class="btn" onclick="att++;start()">다시 도전 (새로 섞기)</button><button class="btn g" onclick="map()">지도</button></div>`)}
title();
</script></body></html>
