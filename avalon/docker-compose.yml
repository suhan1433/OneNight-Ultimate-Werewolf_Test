services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
  backend-1:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    environment: [PORT=3001, REDIS_URL=redis://redis:6379, WEB_ORIGIN=http://localhost:8080, INSTANCE_NAME=server-1]
    depends_on: [redis]
  backend-2:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    environment: [PORT=3001, REDIS_URL=redis://redis:6379, WEB_ORIGIN=http://localhost:8080, INSTANCE_NAME=server-2]
    depends_on: [redis]
  frontend:
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { VITE_SOCKET_URL: http://localhost:8080 } }
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: [./infra/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [frontend, backend-1, backend-2]
volumes: { redis-data: {} }
