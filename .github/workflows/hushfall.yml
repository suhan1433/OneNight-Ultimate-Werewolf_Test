name: Lumen Tether

on:
  push:
    paths: ['hushfall/**', 'game-selector/**', '.github/workflows/hushfall.yml']
  pull_request:
    paths: ['hushfall/**', 'game-selector/**', '.github/workflows/hushfall.yml']

jobs:
  flight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hushfall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hushfall/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check precache size
        run: test "$(du -sk dist | cut -f1)" -le 2048
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:browser
        env:
          LUMEN_TEST_RELAY: 1
